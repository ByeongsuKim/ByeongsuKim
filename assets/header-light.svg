  <line x1="80" y1="278" x2="1120" y2="278" stroke="#e2ddd6" stroke-width="1"/>

  <text x="80" y="306" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
