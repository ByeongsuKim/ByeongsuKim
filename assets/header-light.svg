<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="CodeBee — 교실에서 쓰이는 것을 만듭니다">
  <rect width="1200" height="340" fill="#f6f5f4"/>

  <!-- honeycomb motif, right side, very quiet -->
  <g stroke="#e0d9cf" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M1035 92 l24 14 v28 l-24 14 -24 -14 v-28 z"/>
    <path d="M1083 120 l24 14 v28 l-24 14 -24 -14 v-28 z"/>
    <path d="M1035 148 l24 14 v28 l-24 14 -24 -14 v-28 z"/>
    <path d="M1083 176 l24 14 v28 l-24 14 -24 -14 v-28 z"/>
    <path d="M1131 148 l24 14 v28 l-24 14 -24 -14 v-28 z"/>
  </g>
  <path d="M1083 120 l24 14 v28 l-24 14 -24 -14 v-28 z" fill="#dd5b00" opacity="0.14"/>

